          <!-- Seção de Observações -->
          <div class="premium-card obs-card">
            <h3 class="card-title">Observações</h3>
            <p id="observacoes" class="obs-text"></p>
          </div>

        </div> <!-- Fecha form-column esquerdo -->

        <!-- LADO DIREITO: Dimensões, Detalhes e Contato -->
        <div class="form-column column-right">

          <!-- Seção de Dimensões -->
          <div class="premium-card">
            <h3 class="card-title">Dimensões</h3>
            <div class="grid">
              <div class="campo">
                <div class="aparecia">
                  <span id="comprimento"></span>
                  <span class="divisor"></span>
                  <span class="unidade">comprimento</span>
                </div>
              </div>
              <div class="campo">
                <div class="aparecia">
                  <span id="largura"></span>
                  <span class="divisor"></span>
                  <span class="unidade">Metros</span>
                </div>
              </div>
              <div class="campo">
                <div class="aparecia">
                  <span id="area"></span>
                  <span class="divisor"></span>
                  <span class="unidade mester">M²</span>
                </div>
              </div>
              <div class="campo">
                <div class="aparecia">
                  <span id="testada"></span>
                  <span class="divisor"></span>
                  <span class="unidade">Testada</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Seção de Detalhes -->
          <div class="premium-card">
            <h3 class="card-title">Detalhes do Imóvel</h3>
            <div class="details-list">
              <div class="detail-item">
                <span class="detail-label">Tipo:</span>
                <span class="detail-value destaque-tipo" id="tipo"></span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Topografia:</span>
                <span class="detail-value" id="topografia"></span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Referência:</span>
                <span class="detail-value" id="referencia"></span>
              </div>
            </div>
          </div>

          <!-- Seção de Contato e Compra -->
          <div class="premium-card contact-card">
            <div class="seller-info">
              <div class="detail-item">
                <span class="detail-label">Vendedor:</span>
                <span class="detail-value highlight-value" id="vendedor"></span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Contato:</span>
                <span class="detail-value" id="contato"></span>
              </div>
            </div>

            <div class="linha-separadora"></div>

            <div class="preco-container">
              <div class="preco">R$ <span id="preco"></span></div>
              <button class="botao" onclick="comprar()">Falar com Corretor</button>
            </div>
          </div>

        </div> <!-- Fecha form-column direito -->
      </div> <!-- Fecha form-container -->
    </div> <!-- Fechamento da div container -->
  </div> <!-- Fechamento da div content -->
