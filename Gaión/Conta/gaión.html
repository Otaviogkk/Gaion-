<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gaion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="logo">
        <img src="../Gaiôn.png" alt="Logo Gaion">
    </div>

    <h2>Conecte-se com a <strong>Gaion!</strong></h2>
    <p class="subtitle">Se conecte para continuar</p>

    <div class="input-container">
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="exemplo@gmail.com">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="">
    </div>

    <div class="social-login">
        <img src="../imagens/google_icon.png" alt="Google" onclick="loginSocial('Google')">
        <img src="../imagens/facebook_icon.png" alt="Facebook" onclick="loginSocial('Facebook')">
    </div>
    
    <button onclick="login()">
        <div class="botão">
        Conecte-se
        </div>
    </button>
    

    <div class="links">
        <a href="#">Termos de uso</a> e <a href="#">Políticas de privacidade</a>
    </div>

    <script src="script.js"></script>

</body>
</html>
